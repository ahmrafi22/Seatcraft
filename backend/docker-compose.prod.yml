name: seatcraft

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatcraft}
      POSTGRES_USER: ${POSTGRES_USER:-seatcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatcraft} -d ${POSTGRES_DB:-seatcraft}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-seatcraft};Username=${POSTGRES_USER:-seatcraft};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: seatcraft
      Jwt__Audience: seatcraft-api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      EnableSwagger: "true"
      # The public demo workspace is seeded through this endpoint. It is admin-only
      # and still requires a real login, so this only removes the environment gate.
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
