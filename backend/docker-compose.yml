services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatcraft
      POSTGRES_USER: seatcraft
      POSTGRES_PASSWORD: seatcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatcraft -d seatcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=seatcraft;Username=seatcraft;Password=seatcraft
      ConnectionStrings__Redis: cache:6379
      Jwt__SigningKey: change-this-in-production-to-a-long-random-secret
      EnableSwagger: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  postgres-data:
